# Deploy the static site to GitHub Pages on every push to main.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stamp asset versions (cache busting)
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(src=\"js/[^\"]+)\"#\\1?v=$V\"#g; s#(href=\"css/[^\"]+)\"#\\1?v=$V\"#g" index.html
          grep -o 'js/[a-z]*\.js?v=[0-9a-f]*' index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
